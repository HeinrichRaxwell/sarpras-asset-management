<!DOCTYPE html>
<!--
  layout.html — TEMPLATE REFERENCE ONLY (not a routed page).
  It documents the shared shell that layout.js injects into every page under pages/.
  Real pages never include this file; they only declare:
      <body data-page="data-aset" data-title="Data Aset">
        <main id="app-main"> ...unique page content... </main>
      </body>
  and layout.js replaces the body with the shell below, preserving #app-main's innerHTML.
-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layout Shell Template — Sarpras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { glass: 'rgb(255 255 255 / 0.55)' } } },
    };
  </script>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body data-page="dashboard" data-title="Dashboard">

  <!-- ===================== SIDEBAR (injected by layout.js) ===================== -->
  <div id="sidebar-scrim"></div>
  <aside id="app-sidebar" class="glass-panel w-64 flex flex-col">
    <!-- Brand + nav + logout are rendered by layout.js from the MENU array.
         Groups are collapsible (submenus); active link is set from location.pathname.
         Under the lg breakpoint the sidebar becomes a fixed overlay drawer,
         opened by the hamburger in the header. -->
    <div class="flex items-center gap-2 px-4 py-5"><!-- brand --></div>
    <nav class="px-3 pb-4 flex-1 overflow-y-auto">
      <!-- Dashboard (top-level link) -->
      <!-- DATA MASTER: Data Aset | Gudang Transit QC | Kategori Aset | Lokasi Aset -->
      <!-- KEUANGAN ASET: Penyusutan Nilai | Sumber Dana -->
      <!-- OPERASIONAL: Peminjaman Aset | Mutasi Antar-Ruang | Servis Kuratif | Servis Preventif -->
      <!-- VERIFIKASI & AUDIT: Inventarisasi Fisik | Audit Trail -->
      <!-- HILIR & REKAP: Penghapusan & Lelang | Laporan Aset KIR -->
      <!-- MANAJEMEN SISTEM: Pengguna & Peran | Pengaturan -->
    </nav>
    <div class="p-3 border-t border-slate-200/20"><!-- Keluar --></div>
  </aside>

  <div class="lg:pl-64 min-h-screen flex flex-col">

    <!-- ===================== HEADER (injected by layout.js) ===================== -->
    <header id="app-header" class="glass-panel sticky top-0 z-40 flex items-center gap-3 px-4 lg:px-6 py-3">
      <button id="btn-hamburger" class="btn btn-ghost lg:hidden p-2"><!-- menu icon --></button>
      <h1 class="text-lg font-semibold flex-1 truncate">PAGE TITLE</h1>
      <div class="hidden md:block relative w-64">
        <input id="global-search" class="glass-input pl-9" type="search" placeholder="Cari aset, dokumen..." />
      </div>
      <button id="btn-notif" class="btn btn-ghost p-2 relative"><!-- bell --></button>
      <button id="btn-theme" class="btn btn-ghost p-2"><!-- sun / moon --></button>
      <div class="relative" id="user-menu">
        <button id="btn-user" class="flex items-center gap-2 btn btn-ghost p-1 pr-2">
          <!-- avatar initials + name + chevron -->
        </button>
        <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 glass-card p-2 z-50">
          <!-- user info + Pengaturan + Keluar -->
        </div>
      </div>
    </header>

    <!-- ===================== CONTENT ===================== -->
    <!-- Each page's unique markup is placed here by layout.js from #app-main. -->
    <main id="app-content" class="flex-1 p-4 lg:p-6">
      <!-- ============================================ -->
      <!-- PAGE-SPECIFIC CONTENT GOES INSIDE            -->
      <!-- <main id="app-main"> ... </main>             -->
      <!-- in each individual page under pages/.        -->
      <!-- ============================================ -->
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer id="app-footer" class="px-6 py-4 text-xs text-muted text-center">
      Sistem Manajemen Sarana &amp; Prasarana &copy; <span id="year"></span>
    </footer>
  </div>

  <!-- Scripts (every real page includes the same set, in this order) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/layout.js"></script>
  <!-- Page-specific inline <script> goes LAST. Pattern:
       <script>
         App.onReady = function () {
           // DOM is the real page shell now; safe to bind & fetch.
         };
       </script>
  -->
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
