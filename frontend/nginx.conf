# nginx server config for the Sarpras frontend.
# Serves static files from /usr/share/nginx/html and proxies /api to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-ish fallback: unknown paths without extension -> index (login)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Proxy API calls to the Express backend service.
    # The login page (index.html) calls same-origin /api; nginx forwards it.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
