# Production override: jalankan dengan
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Tujuan: DB & API tidak terekspos ke host; hanya nginx (web) yang publik.

services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS wajib diisi di .env}

  web:
    ports:
      - "${WEB_PORT:-8080}:80"
